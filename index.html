<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Memory Card</title>

<style>
    body{
        margin:0;
        font-family:Arial;
        background:#000010;
        color:white;
        display:flex;
        justify-content:center;
        align-items:flex-start;
        min-height:100vh;
        overflow-y:auto;
        overflow-x:hidden;
        flex-direction:column;
    }

    /* ── GALAXY / STARFIELD ── */
    #galaxy-bg{
        position:fixed;
        top:0; left:0;
        width:100%; height:100%;
        z-index:0;
        pointer-events:none;
    }

    /* Nebula glow layers */
    #galaxy-bg::before{
        content:'';
        position:absolute;
        inset:0;
        background:
            radial-gradient(ellipse 70% 50% at 20% 30%, rgba(80,0,160,0.45) 0%, transparent 70%),
            radial-gradient(ellipse 50% 40% at 80% 70%, rgba(0,60,160,0.40) 0%, transparent 70%),
            radial-gradient(ellipse 60% 50% at 55% 50%, rgba(10,0,40,0.85) 0%, transparent 80%);
    }

    /* Milky-way band */
    #galaxy-bg::after{
        content:'';
        position:absolute;
        inset:0;
        background: linear-gradient(
            125deg,
            transparent 30%,
            rgba(120,60,220,0.12) 45%,
            rgba(60,120,255,0.10) 55%,
            transparent 70%
        );
    }

    /* Star canvas sits inside #galaxy-bg */
    #starCanvas{
        position:absolute;
        inset:0;
        width:100%; height:100%;
    }

    /* Everything else above the bg */
    .screen, #confetti{ position:relative; z-index:1; }

    .screen{display:none; width:100%; max-width:900px; text-align:center; margin:0 auto; padding:20px 16px 40px; box-sizing:border-box;}
    .active{display:block;}

    h1{letter-spacing:3px;}

    button, select{
        padding:10px;
        margin:5px;
        border:none;
        border-radius:10px;
        cursor:pointer;
        font-weight:bold;
    }

    button{background:#6a0dad; color:white; transition:0.3s;}
    button:hover{transform:scale(1.05);}
    button.active-sound{background:#28a745; outline: 2px solid #fff;}

    .menu-btn{width:220px; display:block; margin:10px auto; font-size:18px;}

    .levels{
        display:grid;
        grid-template-columns:repeat(5,1fr);
        gap:8px;
        margin-top:20px;
    }

    .level{
        padding:12px 8px;
        background:rgba(255,255,255,0.08);
        border-radius:12px;
        cursor:pointer;
        transition:0.3s;
        font-size:13px;
    }
    .level:hover{transform:scale(1.05); background:rgba(255,255,255,0.18);}
    .level .diff{ font-size:10px; margin-top:4px; opacity:0.75; }
    .diff-easy   { color:#4fc; }
    .diff-medium { color:#fa0; }
    .diff-hard   { color:#f64; }
    .diff-expert { color:#f0f; }

    .locked{
        opacity:0.3;
        pointer-events:none;
    }

    .board{
        display:grid;
        gap:10px;
        justify-content:center;
        margin-top:10px;
    }

    .card{
        width:65px;
        height:65px;
        perspective:1000px;
        cursor:pointer;
    }

    .inner{
        width:100%; height:100%;
        position:relative;
        transform-style:preserve-3d;
        transition:0.5s;
    }

    .flip .inner{transform:rotateY(180deg);}

    .front,.back{
        position:absolute;
        width:100%;height:100%;
        display:flex;
        justify-content:center;
        align-items:center;
        border-radius:10px;
        backface-visibility:hidden;
        font-size:22px;
    }

    .front{background:rgba(255,255,255,0.08);}
    .back{background:white;color:black; transform:rotateY(180deg);}

    .topbar{
        margin:10px;
        display:flex;
        justify-content:space-between;
        font-size:14px;
        opacity:0.9;
    }

    .confetti{
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        pointer-events:none;
        overflow:hidden;
        z-index:2;
    }

    .piece{
        position:absolute;
        width:8px;
        height:12px;
        background:red;
        animation:fall 2s linear forwards;
    }

    @keyframes fall{
        to{transform:translateY(100vh) rotate(720deg); opacity:0;}
    }
</style>
</head>
<body>

<!-- Galaxy Background -->
<div id="galaxy-bg">
    <canvas id="starCanvas"></canvas>
</div>

<div id="confetti" class="confetti"></div>

<!-- MENU -->
<div id="menu" class="screen active">
    <h1>Memory Card</h1>
    <button class="menu-btn" onclick="showPlay()">▶ Play</button>
    <button class="menu-btn" onclick="showChallenges()">🏆 Challenges</button>
    <button class="menu-btn" onclick="showSettings()">⚙ Settings</button>
    <button class="menu-btn" onclick="resetProgress()">♻ Reset Progress</button>
</div>

<!-- SETTINGS -->
<div id="settings" class="screen">
    <h1>Settings</h1>

    Sound
    <select id="sound">
        <option value="on">ON</option>
        <option value="off">OFF</option>
    </select>

    <br><br>

    Sound Style
    <br>
    <div id="soundThemeBtns" style="margin:8px auto; display:flex; flex-wrap:wrap; justify-content:center; gap:8px; max-width:500px;">
        <button onclick="setSoundTheme('piano')"   id="st-piano"   style="min-width:120px;">🎹 Piano</button>
        <button onclick="setSoundTheme('water')"   id="st-water"   style="min-width:120px;">💧 Water Drops</button>
        <button onclick="setSoundTheme('retro')"   id="st-retro"   style="min-width:120px;">🕹️ Retro Lo-fi</button>
        <button onclick="setSoundTheme('magical')" id="st-magical" style="min-width:120px;">✨ Magical</button>
    </div>
    <small style="opacity:0.6;">Tap a style to preview it</small>

    <br><br>

    Grid
    <select id="grid">
        <option value="4">4x4</option>
        <option value="6">6x6</option>
        <option value="8">8x8</option>
    </select>

    <br><br>

    Theme
    <select id="theme">
        <option value="emojis">Emojis</option>
        <option value="animals">Animals</option>
        <option value="fruits">Fruits</option>
        <option value="sports">Sports</option>
        <option value="vehicles">Vehicles</option>
        <option value="space">Space</option>
    </select>

    <br><br>

    <button onclick="backMenu()">Back</button>
</div>

<!-- LEVELS -->
<div id="levels" class="screen">
    <h1>Levels</h1>
    <div class="levels" id="levelBox"></div>
    <button onclick="backMenu()">Back</button>
</div>

<!-- CHALLENGES -->
<div id="challenges" class="screen">
    <h1>🏆 Challenges</h1>
    <p style="opacity:0.6; margin-top:-10px;">Special goals — can you beat them all?</p>
    <div id="challengeList" style="display:flex; flex-direction:column; gap:12px; margin-top:16px;"></div>
    <button onclick="backMenu()" style="margin-top:24px;">Back</button>
</div>

<!-- CHALLENGE GAME -->
<div id="cgame" class="screen">
    <div class="topbar">
        <div>Moves: <span id="cmoves">0</span> <span id="cmoveLimit" style="opacity:0.5;"></span></div>
        <div id="ctimeBox">Time: <span id="ctime">0</span>s <span id="ctimeLimit" style="opacity:0.5;"></span></div>
        <div><span id="cname" style="font-size:12px; color:#adf;"></span></div>
    </div>
    <div class="board" id="cboard"></div>
    <div id="cwinOverlay" style="display:none; margin-top:20px;">
        <h2 style="color:#f0c040;">🎉 Challenge Complete!</h2>
        <p id="cwinMsg" style="opacity:0.8;"></p>
        <button onclick="showChallenges()" style="font-size:16px; padding:10px 26px; background:#28a745; margin:6px;">🏆 Challenges</button>
        <button onclick="backMenu()" style="font-size:16px; padding:10px 26px; margin:6px;">🏠 Menu</button>
    </div>
    <div id="cfailOverlay" style="display:none; margin-top:20px;">
        <h2 style="color:#f64;">❌ Challenge Failed!</h2>
        <p id="cfailMsg" style="opacity:0.8;"></p>
        <button onclick="restartChallenge()" style="font-size:16px; padding:10px 26px; background:#e07800; margin:6px;">🔄 Restart</button>
        <button onclick="showChallenges()" style="font-size:16px; padding:10px 26px; margin:6px;">🏆 Challenges</button>
    </div>
    <div id="cexitBtn">
        <button onclick="showChallenges()" style="margin-top:12px;">Exit Challenge</button>
    </div>
</div>

<!-- GAME -->
<div id="game" class="screen">
    <div class="topbar">
        <div>Moves: <span id="moves">0</span></div>
        <div>Time: <span id="time">0</span>s <span id="timeLimit" style="opacity:0.5;"></span></div>
        <div>Level: <span id="lvl">1</span> &nbsp;<span id="diffLabel" style="font-size:11px;"></span></div>
    </div>

    <div class="board" id="board"></div>

    <!-- Win overlay shown after level complete -->
    <div id="winOverlay" style="display:none; margin-top:20px;">
        <h2 style="color:#f0c040;">🎉 Level Complete!</h2>
        <p style="opacity:0.8;">Moves: <span id="winMoves"></span> &nbsp;|&nbsp; Time: <span id="winTime"></span>s</p>
        <button onclick="nextLevel()" style="font-size:18px; padding:12px 30px; background:#28a745; margin:6px;">▶ Next Level</button>
        <button onclick="backLevels()" style="font-size:18px; padding:12px 30px; margin:6px;">📋 Levels</button>
    </div>

    <div id="exitBtn">
        <button onclick="backLevels()" style="margin-top:12px;">EXIT</button>
    </div>
</div>

<script>
/* ── STARFIELD ── */
(function(){
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    let W, H, stars = [], shooters = [];

    function resize(){
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }

    function initStars(){
        stars = [];
        for(let i = 0; i < 320; i++){
            stars.push({
                x: Math.random()*W,
                y: Math.random()*H,
                r: Math.random()*1.4 + 0.2,
                alpha: Math.random()*0.6 + 0.2,
                twinkleSpeed: Math.random()*0.02 + 0.005,
                twinkleDir: Math.random() > 0.5 ? 1 : -1
            });
        }
    }

    function spawnShooter(){
        shooters.push({
            x: Math.random()*W*0.7,
            y: Math.random()*H*0.4,
            len: 120 + Math.random()*80,
            speed: 6 + Math.random()*6,
            alpha: 1,
            angle: Math.PI/5
        });
    }

    setInterval(spawnShooter, 3500);

    function draw(){
        ctx.clearRect(0,0,W,H);

        /* stars */
        stars.forEach(s => {
            s.alpha += s.twinkleSpeed * s.twinkleDir;
            if(s.alpha >= 1 || s.alpha <= 0.1) s.twinkleDir *= -1;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
            ctx.fillStyle = `rgba(255,255,255,${s.alpha.toFixed(2)})`;
            ctx.fill();
        });

        /* shooting stars */
        shooters = shooters.filter(s => s.alpha > 0);
        shooters.forEach(s => {
            const dx = Math.cos(s.angle)*s.len;
            const dy = Math.sin(s.angle)*s.len;
            const grad = ctx.createLinearGradient(s.x, s.y, s.x-dx, s.y-dy);
            grad.addColorStop(0, `rgba(255,255,255,${s.alpha.toFixed(2)})`);
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(s.x - dx, s.y - dy);
            ctx.strokeStyle = grad;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            s.x += Math.cos(s.angle)*s.speed;
            s.y += Math.sin(s.angle)*s.speed;
            s.alpha -= 0.018;
        });

        requestAnimationFrame(draw);
    }

    window.addEventListener('resize', ()=>{ resize(); initStars(); });
    resize(); initStars(); draw();
})();


/* ── GAME LOGIC (unchanged) ── */
let board=[],flipped=[],matched=[];
let moves=0,time=0,timer;
let sound=true;
let currentLevel=1;

const themes={
 emojis:["😀","😎","🤖","👻","🔥","🎉","💎","🚀"],
 animals:["🐶","🐱","🐼","🦁","🐸","🐵","🐯","🐰"],
 fruits:["🍎","🍌","🍇","🍉","🍓","🍍","🥝","🍒"],
 sports:["⚽","🏀","🏈","🎾","🏐","🏓","🥊","🏏"],
 vehicles:["🚗","🚕","🚙","🚌","🏎","🚓","🚑","✈️"],
 space:["🌍","🌙","⭐","☄️","🪐","🚀","🌌","👽"]
};

function show(id){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}

function showPlay(){
 generateLevels();
 show('levels');
}

function backMenu(){show('menu');}
function backLevels(){
 clearInterval(timer);
 generateLevels();
 show('levels');
}

// Returns difficulty config for each level
function getLevelConfig(lvl){
 // Levels 1-10:  Easy   — 4x4 grid, no time limit
 // Levels 11-20: Medium — 4x4 grid, 60s time limit
 // Levels 21-35: Hard   — 6x6 grid, 90s time limit
 // Levels 36-50: Expert — 6x6 grid, 60s time limit + cards briefly shown then hidden
 if(lvl <= 10)  return { grid:4, timeLimit:0,  peek:0,   diff:'Easy',   diffClass:'diff-easy'   };
 if(lvl <= 20)  return { grid:4, timeLimit:60, peek:0,   diff:'Medium', diffClass:'diff-medium' };
 if(lvl <= 35)  return { grid:6, timeLimit:90, peek:0,   diff:'Hard',   diffClass:'diff-hard'   };
                return { grid:6, timeLimit:60, peek:1500, diff:'Expert', diffClass:'diff-expert' };
}

const TOTAL_LEVELS = 50;

function generateLevels(){
 const box=document.getElementById('levelBox');
 box.innerHTML='';
 let unlocked=parseInt(localStorage.getItem('unlocked')||1);

 for(let i=1;i<=TOTAL_LEVELS;i++){
    const cfg = getLevelConfig(i);
    let d=document.createElement('div');
    d.className='level'+(i>unlocked?' locked':'');
    d.innerHTML=`Level ${i}<div class="diff ${cfg.diffClass}">${cfg.diff}</div>`;
    d.onclick=()=>startGame(i);
    box.appendChild(d);
 }
}

let timeLimit = 0;

function startGame(lvl){
 currentLevel=lvl;
 const cfg = getLevelConfig(lvl);

 document.getElementById('lvl').innerText=lvl;
 document.getElementById('diffLabel').innerText=cfg.diff;
 document.getElementById('diffLabel').className=cfg.diffClass;
 document.getElementById('timeLimit').innerText = cfg.timeLimit ? `/ ${cfg.timeLimit}s` : '';

 let theme=document.getElementById('theme').value;
 sound=document.getElementById('sound').value==='on';
 timeLimit = cfg.timeLimit;

 board=[];flipped=[];matched=[];
 moves=0;time=0;
 document.getElementById('winOverlay').style.display='none';
 document.getElementById('exitBtn').style.display='block';
 document.getElementById('moves').innerText=0;
 document.getElementById('time').innerText=0;

 // Build pool — for 6x6 we need 18 pairs, combine all theme sets
 const allEmojis = Object.values(themes).flat();
 const themePool = [...themes[theme]];
 // If we need more pairs than theme has, pull from all emojis
 let need=(cfg.grid*cfg.grid)/2;
 let pool = [...new Set([...themePool, ...allEmojis])].slice(0, need);
 pool = pool.sort(()=>Math.random()-0.5);
 board=[...pool,...pool].sort(()=>Math.random()-0.5);

 // Card size shrinks for 6x6
 const cardSize = cfg.grid === 4 ? 65 : 52;

 let el=document.getElementById('board');
 el.innerHTML='';
 el.style.gridTemplateColumns=`repeat(${cfg.grid},${cardSize}px)`;

 board.forEach((v,i)=>{
    let c=document.createElement('card-el');
    c=document.createElement('div');
    c.className='card';
    c.style.width=cardSize+'px';
    c.style.height=cardSize+'px';
    c.innerHTML=`<div class='inner'><div class='front'></div><div class='back' style='font-size:${cfg.grid===4?22:16}px'>${v}</div></div>`;
    c.onclick=()=>flip(c,i);
    el.appendChild(c);
 });

 show('game');
 clearInterval(timer);

 // Expert mode: briefly show all cards then hide them
 if(cfg.peek > 0){
    document.querySelectorAll('.card').forEach(c=>c.classList.add('flip'));
    setTimeout(()=>{
        document.querySelectorAll('.card').forEach(c=>{
            if(!matched.includes([...document.querySelectorAll('.card')].indexOf(c)))
                c.classList.remove('flip');
        });
        startTimer();
    }, cfg.peek);
 } else {
    startTimer();
 }
}

function startTimer(){
 clearInterval(timer);
 timer=setInterval(()=>{
    time++;
    document.getElementById('time').innerText=time;
    // Time's up!
    if(timeLimit > 0 && time >= timeLimit){
        clearInterval(timer);
        setTimeout(()=>{
            alert('⏰ Time\'s up! Try again.');
            startGame(currentLevel);
        }, 300);
    }
 },1000);
}

// One shared AudioContext
let audioCtx = null;
let currentSoundTheme = localStorage.getItem('soundTheme') || 'magical';

function getAudioCtx(){
 if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state === 'suspended') audioCtx.resume();
 return audioCtx;
}

function playNote(freq, duration, type='sine', vol=0.1, fadeIn=0.01){
 if(!sound) return;
 try {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + fadeIn);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(ctx.currentTime); osc.stop(ctx.currentTime + duration);
 } catch(e){}
}

const soundThemes = {
 retro: {
  flip:  ()=>{ playNote(220, 0.12, 'square', 0.07, 0.01); },
  match: ()=>{ playNote(330, 0.15, 'square', 0.08); setTimeout(()=>playNote(440, 0.18, 'square', 0.08), 100); },
  win:   ()=>{ [262,330,392,523].forEach((f,i)=>setTimeout(()=>playNote(f,0.2,'square',0.09),i*110)); }
 },
 piano: {
  flip:  ()=>{ playNote(523, 0.4, 'sine', 0.10, 0.005); },
  match: ()=>{ playNote(659, 0.5, 'sine', 0.10, 0.005); setTimeout(()=>playNote(784,0.5,'sine',0.09,0.005),130); },
  win:   ()=>{ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playNote(f,0.55,'sine',0.10,0.005),i*160)); }
 },
 water: {
  flip: ()=>{
   // water drop: pitch bends down quickly
   try{
    const ctx=getAudioCtx(); const osc=ctx.createOscillator(); const gain=ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(900, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime+0.18);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.22);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime+0.25);
   }catch(e){}
  },
  match: ()=>{
   [700,500].forEach((f,i)=>setTimeout(()=>{
    try{
     const ctx=getAudioCtx(); const osc=ctx.createOscillator(); const gain=ctx.createGain();
     osc.type='sine';
     osc.frequency.setValueAtTime(f, ctx.currentTime);
     osc.frequency.exponentialRampToValueAtTime(f*0.4, ctx.currentTime+0.22);
     gain.gain.setValueAtTime(0.11, ctx.currentTime);
     gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.25);
     osc.connect(gain); gain.connect(ctx.destination);
     osc.start(ctx.currentTime); osc.stop(ctx.currentTime+0.28);
    }catch(e){}
   },i*140));
  },
  win: ()=>{ [900,700,500,350].forEach((f,i)=>setTimeout(()=>{
   try{
    const ctx=getAudioCtx(); const osc=ctx.createOscillator(); const gain=ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(f, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(f*0.4, ctx.currentTime+0.3);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime+0.38);
   }catch(e){}
  },i*140)); }
 },
 magical: {
  flip:  ()=>{ playNote(1047, 0.25, 'sine', 0.08, 0.01); setTimeout(()=>playNote(1319,0.2,'sine',0.06,0.01),80); },
  match: ()=>{ [1047,1319,1568].forEach((f,i)=>setTimeout(()=>playNote(f,0.3,'sine',0.08,0.01),i*80)); },
  win:   ()=>{ [784,1047,1319,1568,2093].forEach((f,i)=>setTimeout(()=>playNote(f,0.35,'sine',0.09,0.01),i*120)); }
 }
};

function beep()     { soundThemes[currentSoundTheme].flip();  }
function playMatch(){ soundThemes[currentSoundTheme].match(); }
function playWin()  { soundThemes[currentSoundTheme].win();   }

function setSoundTheme(t){
 currentSoundTheme = t;
 localStorage.setItem('soundTheme', t);
 highlightSoundTheme();
 soundThemes[t].flip();
}

function highlightSoundTheme(){
 ['piano','water','retro','magical'].forEach(t=>{
  const btn = document.getElementById('st-'+t);
  if(btn) btn.classList.toggle('active-sound', t === currentSoundTheme);
 });
}

function showSettings(){
 highlightSoundTheme();
 show('settings');
}

function flip(card,i){
 if(card.classList.contains('flip')||matched.includes(i)||flipped.length===2)return;
 card.classList.add('flip');beep();flipped.push(i);
 if(flipped.length===2)setTimeout(check,600);
}

function check(){
 let [a,b]=flipped;
 let cards=document.querySelectorAll('.card');

 if(board[a]===board[b]){
    matched.push(a,b);
    playMatch();
 }else{
    cards[a].classList.remove('flip');
    cards[b].classList.remove('flip');
 }

 flipped=[];
 moves++;
 document.getElementById('moves').innerText=moves;

 if(matched.length===board.length){
    clearInterval(timer);
    win();
 }
}

function win(){
 confetti();
 playWin();
 // Always unlock next level, never downgrade existing progress
 let unlocked = parseInt(localStorage.getItem('unlocked')||1);
 let newUnlocked = Math.max(unlocked, currentLevel + 1);
 localStorage.setItem('unlocked', newUnlocked);
 // Show win overlay instead of alert
 document.getElementById('winMoves').innerText = moves;
 document.getElementById('winTime').innerText = time;
 document.getElementById('winOverlay').style.display = 'block';
 document.getElementById('exitBtn').style.display = 'none';
}

function nextLevel(){
 let next = currentLevel + 1;
 if(next > TOTAL_LEVELS){
    alert('🏆 You beat all 50 levels! You\'re a Memory Card master!');
    backLevels();
    return;
 }
 document.getElementById('winOverlay').style.display = 'none';
 document.getElementById('exitBtn').style.display = 'block';
 startGame(next);
}

function confetti(){
 const c=document.getElementById('confetti');
 c.innerHTML='';
 for(let i=0;i<80;i++){
    let d=document.createElement('div');
    d.className='piece';
    d.style.left=Math.random()*100+'%';
    d.style.background=['red','blue','yellow','green','purple'][Math.floor(Math.random()*5)];
    d.style.animationDuration=(1+Math.random()*2)+'s';
    c.appendChild(d);
 }
}

function resetProgress(){
 localStorage.removeItem('unlocked');
 alert('Progress Reset');
}

/* ── CHALLENGES ── */
const CHALLENGES = [
 { id:'c1',  name:'Speed Demon',       desc:'Finish a 4×4 board in under 30 seconds',        grid:4, moveLimit:0,  timeLimit:30,  icon:'⚡' },
 { id:'c2',  name:'Minimalist',        desc:'Finish a 4×4 board in 20 moves or less',         grid:4, moveLimit:20, timeLimit:0,   icon:'🎯' },
 { id:'c3',  name:'Quick Fingers',     desc:'Finish a 4×4 board in under 60 seconds',         grid:4, moveLimit:0,  timeLimit:60,  icon:'🏃' },
 { id:'c4',  name:'Perfect Memory',    desc:'Finish a 4×4 board in 16 moves or less',         grid:4, moveLimit:16, timeLimit:0,   icon:'🧠' },
 { id:'c5',  name:'The Blitz',         desc:'Finish a 4×4 board in under 45s & 22 moves',    grid:4, moveLimit:22, timeLimit:45,  icon:'💥' },
 { id:'c6',  name:'Big Board Beginner',desc:'Finish a 6×6 board in under 3 minutes',          grid:6, moveLimit:0,  timeLimit:180, icon:'🗺️' },
 { id:'c7',  name:'Efficiency Master', desc:'Finish a 6×6 board in 40 moves or less',         grid:6, moveLimit:40, timeLimit:0,   icon:'🔬' },
 { id:'c8',  name:'Marathon',          desc:'Finish a 6×6 board in under 2 minutes',          grid:6, moveLimit:0,  timeLimit:120, icon:'🏅' },
 { id:'c9',  name:'Ninja',             desc:'Finish a 6×6 board in 30 moves or less',         grid:6, moveLimit:30, timeLimit:0,   icon:'🥷' },
 { id:'c10', name:'Ultimate',          desc:'Finish a 6×6 board in under 90s & 35 moves',    grid:6, moveLimit:35, timeLimit:90,  icon:'👑' },
];

let activeChallenge = null;
let cmoves=0, ctime=0, ctimer;
let cboard=[], cflipped=[], cmatched=[];

function showChallenges(){
 renderChallenges();
 show('challenges');
}

function renderChallenges(){
 const list = document.getElementById('challengeList');
 list.innerHTML = '';
 CHALLENGES.forEach(ch => {
    const done = localStorage.getItem('ch_'+ch.id) === 'done';
    const div = document.createElement('div');
    div.style.cssText = `
        background:rgba(255,255,255,${done?'0.14':'0.07'});
        border-radius:14px; padding:16px 20px;
        display:flex; align-items:center; justify-content:space-between;
        border:1px solid rgba(255,255,255,${done?'0.25':'0.08'});
        cursor:pointer; transition:0.2s;
    `;
    div.onmouseover = ()=> div.style.background='rgba(255,255,255,0.18)';
    div.onmouseout  = ()=> div.style.background=`rgba(255,255,255,${done?'0.14':'0.07'})`;
    div.innerHTML = `
        <div style="text-align:left;">
            <div style="font-size:16px; font-weight:bold;">${ch.icon} ${ch.name} ${done?'<span style="color:#4fc;font-size:12px;">✔ Completed</span>':''}</div>
            <div style="font-size:12px; opacity:0.65; margin-top:4px;">${ch.desc}</div>
            <div style="font-size:11px; margin-top:6px; opacity:0.5;">
                ${ch.grid}×${ch.grid} grid
                ${ch.timeLimit ? ' &nbsp;⏱ '+ch.timeLimit+'s limit' : ''}
                ${ch.moveLimit ? ' &nbsp;🎯 '+ch.moveLimit+' moves max' : ''}
            </div>
        </div>
        <button style="min-width:80px; font-size:13px; padding:8px 14px; background:${done?'#28a745':'#6a0dad'};">
            ${done ? 'Replay' : 'Start'}
        </button>
    `;
    div.querySelector('button').onclick = (e)=>{ e.stopPropagation(); startChallenge(ch); };
    list.appendChild(div);
 });
}

let ccardsLocked = true; // prevents auto-click on entry

function startChallenge(ch){
 activeChallenge = ch;
 cboard=[];cflipped=[];cmatched=[];
 cmoves=0;ctime=0;
 ccardsLocked = true;
 clearInterval(ctimer);

 document.getElementById('cname').innerText = ch.icon+' '+ch.name;
 document.getElementById('cmoves').innerText = 0;
 document.getElementById('ctime').innerText = 0;
 document.getElementById('cmoveLimit').innerText = ch.moveLimit ? '/ '+ch.moveLimit : '';
 document.getElementById('ctimeLimit').innerText = ch.timeLimit ? '/ '+ch.timeLimit+'s' : '';
 document.getElementById('cwinOverlay').style.display  = 'none';
 document.getElementById('cfailOverlay').style.display = 'none';
 document.getElementById('cexitBtn').style.display     = 'block';

 const theme = document.getElementById('theme').value;
 const allEmojis = Object.values(themes).flat();
 const themePool = [...themes[theme]];
 let need = (ch.grid*ch.grid)/2;
 let pool = [...new Set([...themePool,...allEmojis])].slice(0,need).sort(()=>Math.random()-0.5);
 cboard = [...pool,...pool].sort(()=>Math.random()-0.5);

 const cardSize = ch.grid===4 ? 65 : 52;
 const el = document.getElementById('cboard');
 el.innerHTML='';
 el.style.gridTemplateColumns=`repeat(${ch.grid},${cardSize}px)`;

 cboard.forEach((v,i)=>{
    const c = document.createElement('div');
    c.className='card';
    c.style.width=cardSize+'px';
    c.style.height=cardSize+'px';
    c.innerHTML=`<div class='inner'><div class='front'></div><div class='back' style='font-size:${ch.grid===4?22:16}px'>${v}</div></div>`;
    c.onclick=()=>cflip(c,i);
    el.appendChild(c);
 });

 show('cgame');

 // Unlock cards after a short delay — prevents the Start button click
 // from immediately registering as a card flip
 setTimeout(()=>{ ccardsLocked = false; }, 400);

 ctimer = setInterval(()=>{
    ctime++;
    document.getElementById('ctime').innerText=ctime;
    if(ch.timeLimit>0 && ctime>=ch.timeLimit){
        clearInterval(ctimer);
        cFail('⏰ Time\'s up! You needed '+ch.timeLimit+'s but ran out.');
    }
 },1000);
}

function restartChallenge(){
 startChallenge(activeChallenge);
}

function cFail(msg){
 document.getElementById('cfailMsg').innerText = msg;
 document.getElementById('cfailOverlay').style.display = 'block';
 document.getElementById('cexitBtn').style.display     = 'none';
}

function cflip(card,i){
 if(ccardsLocked||card.classList.contains('flip')||cmatched.includes(i)||cflipped.length===2)return;
 card.classList.add('flip'); beep(); cflipped.push(i);
 if(cflipped.length===2) setTimeout(ccheck,600);
}

function ccheck(){
 const [a,b]=cflipped;
 const cards=document.querySelectorAll('#cboard .card');
 if(cboard[a]===cboard[b]){
    cmatched.push(a,b);
    playMatch();
 } else {
    cards[a].classList.remove('flip');
    cards[b].classList.remove('flip');
 }
 cflipped=[];
 cmoves++;
 document.getElementById('cmoves').innerText=cmoves;

 // Exceeded move limit — show fail overlay, no auto-reset
 if(activeChallenge.moveLimit>0 && cmoves>activeChallenge.moveLimit){
    clearInterval(ctimer);
    cFail('🎯 Move limit exceeded! You used '+cmoves+' moves (limit: '+activeChallenge.moveLimit+').');
    return;
 }

 if(cmatched.length===cboard.length){
    clearInterval(ctimer);
    cwin();
 }
}

function cwin(){
 confetti(); playWin();
 localStorage.setItem('ch_'+activeChallenge.id,'done');
 const ch = activeChallenge;
 let msg = `Finished in ${ctime}s with ${cmoves} moves!`;
 if(ch.timeLimit>0) msg += ` &nbsp;⏱ ${ctime}/${ch.timeLimit}s`;
 if(ch.moveLimit>0) msg += ` &nbsp;🎯 ${cmoves}/${ch.moveLimit} moves`;
 document.getElementById('cwinMsg').innerHTML = msg;
 document.getElementById('cwinOverlay').style.display='block';
 document.getElementById('cexitBtn').style.display='none';
}
</script>
